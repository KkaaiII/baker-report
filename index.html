<style>

:root,[data-theme="light"]{
  --bg:#eef1f6; --bg2:#e3e8f0;
  --glass:rgba(255,255,255,.55); --glass-brd:rgba(255,255,255,.65);
  --card:rgba(255,255,255,.5); --card-brd:rgba(140,150,180,.22);
  --text:#1b1f2b; --mu:#5b6172; --faint:#9aa0b2;
  --blue:#2f6fed; --teal:#0ea5a0; --green:#2e9e5b; --pink:#e0507a; --gold:#d59a1f; --gold-g:rgba(213,154,31,.15);
  --shadow:0 8px 32px rgba(31,41,71,.10);
}
[data-theme="dark"]{
  --bg:#0d1017; --bg2:#141824;
  --glass:rgba(30,34,46,.55); --glass-brd:rgba(255,255,255,.10);
  --card:rgba(35,39,52,.48); --card-brd:rgba(255,255,255,.08);
  --text:#e8eaf0; --mu:#9aa0b5; --faint:#5c6172;
  --blue:#5b93ff; --teal:#3fd0c9; --green:#5cd485; --pink:#ff7fa3; --gold:#f0c04a; --gold-g:rgba(240,192,74,.15);
  --shadow:0 8px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,*,*::before,*::after{transition:background-color .4s cubic-bezier(.4,0,.2,1),color .4s cubic-bezier(.4,0,.2,1),border-color .4s cubic-bezier(.4,0,.2,1),box-shadow .4s cubic-bezier(.4,0,.2,1)}
body{margin:0;font-family:'Noto Sans TC',sans-serif;color:var(--text);
  background:
    radial-gradient(ellipse 70% 50% at 15% 0%, color-mix(in oklch,var(--blue) 12%,transparent) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 20%, color-mix(in oklch,var(--teal) 10%,transparent) 0%, transparent 60%),
    linear-gradient(160deg,var(--bg),var(--bg2));
  min-height:100vh;
}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  background:var(--glass);border-bottom:1px solid var(--glass-brd);}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.brand svg{width:26px;height:26px;color:var(--blue)}
.nav{display:flex;gap:8px}
.nav button{padding:9px 18px;border-radius:999px;border:1px solid transparent;background:transparent;
  color:var(--mu);font-weight:700;font-size:14px;cursor:pointer;transition:all .3s cubic-bezier(.16,1,.3,1)}
.nav button:hover{background:color-mix(in oklch,var(--blue) 10%,transparent);color:var(--text)}
.nav button.active{background:var(--blue);color:#fff;box-shadow:0 4px 16px color-mix(in oklch,var(--blue) 40%,transparent)}
.right{display:flex;align-items:center;gap:12px}
.updated{font-size:12px;color:var(--faint)}
#themeBtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--card-brd);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px)}
#themeBtn svg{width:18px;height:18px;color:var(--text)}
#themeBtn:active{transform:scale(.9)}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
.page{display:none;animation:fadeUp .5s cubic-bezier(.16,1,.3,1)}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph h2{font-size:clamp(24px,3vw,32px);margin:4px 0 4px;font-weight:900}
.ph p{color:var(--mu);margin:0 0 20px;font-size:14px}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;
  background:color-mix(in oklch,var(--blue) 16%,transparent);color:var(--blue)}
.pill-gold{background:var(--gold-g);color:var(--gold)}
.sec{font-weight:800;font-size:15px;margin:28px 0 12px;color:var(--text)}
.card{background:var(--card);border:1px solid var(--card-brd);border-radius:20px;padding:22px;
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);box-shadow:var(--shadow);
  transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s ease;position:relative;z-index:1;}
.card:hover{transform:translateY(-3px)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in oklch,var(--kc) 10%,transparent),transparent 60%)}
.kpi-l{font-size:13px;color:var(--mu);font-weight:600;position:relative}
.kpi-v{font-size:30px;font-weight:900;color:var(--kc);margin:6px 0 2px;position:relative;font-variant-numeric:tabular-nums}
.kpi-s{font-size:12px;color:var(--faint);position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mu);font-weight:700;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--card-brd)}
td{padding:11px 12px;border-bottom:1px solid var(--card-brd);vertical-align:top}
tbody tr{transition:background .2s}
tbody tr:hover{background:color-mix(in oklch,var(--blue) 5%,transparent)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-owner{background:color-mix(in oklch,var(--blue) 16%,transparent);color:var(--blue)}
.b-design{background:color-mix(in oklch,var(--green) 16%,transparent);color:var(--green)}
.b-other{background:color-mix(in oklch,var(--mu) 16%,transparent);color:var(--mu)}
.b-learn{background:color-mix(in oklch,var(--teal) 16%,transparent);color:var(--teal)}
.b-purchase{background:color-mix(in oklch,var(--pink) 16%,transparent);color:var(--pink)}
.diff{font-weight:800;font-size:13px}
.up{color:var(--green)}.dn{color:var(--pink)}.eq{color:var(--mu)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.f-btn{padding:8px 16px;border-radius:999px;border:1px solid var(--card-brd);background:var(--card);
  color:var(--mu);font-weight:700;font-size:13px;cursor:pointer;backdrop-filter:blur(10px);transition:all .3s cubic-bezier(.16,1,.3,1)}
.f-btn:hover{transform:translateY(-2px)}
.f-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.month-block{margin-bottom:22px}
.mb-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mb-hd h3{margin:0;font-size:17px;font-weight:800}
.mb-hd p{margin:2px 0 0;font-size:13px;color:var(--mu)}
.tbl-scroll{overflow-x:auto}
.staff-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.staff-card{background:var(--card);border:1px solid var(--card-brd);border-radius:16px;padding:16px;text-align:center;backdrop-filter:blur(14px)}
.sc-name{font-weight:700;font-size:14px;color:var(--mu)}
.sc-num{font-size:26px;font-weight:900;margin:6px 0 2px}
.sc-l{font-size:12px;color:var(--faint)}
.a-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.a-grid{grid-template-columns:1fr}}
.a-card{position:relative}
.a-card::before{content:'';position:absolute;top:0;left:22px;right:22px;height:3px;border-radius:0 0 4px 4px;background:var(--ac)}
.a-tag{font-size:12px;font-weight:800;color:var(--ac);margin-bottom:6px}
.a-title{font-weight:800;font-size:16px;margin-bottom:8px}
.a-text{font-size:13.5px;color:var(--mu);line-height:1.7}
.chart-wrap{position:relative;height:280px}
.drop-wrap{position:relative}
.drop-btn{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;
  background:rgba(20,24,32,.9);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(1.6);
  cursor:pointer;font-weight:700;font-size:14px;min-width:190px;box-shadow:var(--shadow);
  color:#fff !important;}
.drop-btn svg{color:#fff !important;stroke:#fff !important}
#db-icon,#db-label{color:#fff !important}
.drop-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:230px;border-radius:16px;
  background:rgba(18,22,30,.92);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(28px) saturate(1.8);
  box-shadow:0 20px 50px rgba(0,0,0,.45);padding:8px;display:none;z-index:9999;}
.drop-menu.open{display:block;animation:fadeUp .25s cubic-bezier(.16,1,.3,1)}
.drop-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;
  color:#fff !important;font-size:13.5px;font-weight:600}
.drop-item:hover,.drop-item.active{background:rgba(255,255,255,.10)}
.drop-g-label{font-size:11px;color:rgba(255,255,255,.5);padding:8px 12px 4px;font-weight:700}
.di-badge{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);color:#fff !important;padding:2px 8px;border-radius:999px}
.src-card-outer{position:relative;z-index:200;isolation:isolate;}
.src-layout{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:28px}
@media(max-width:640px){.src-layout{grid-template-columns:1fr}}
.src-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.src-label{width:64px;font-size:14px;color:var(--mu);font-weight:600;flex-shrink:0}
.src-track{flex:1;background:color-mix(in oklch,var(--text) 8%,transparent);border-radius:7px;height:14px;overflow:hidden;min-width:60px}
.src-fill{height:100%;border-radius:7px;transition:width 1.2s cubic-bezier(.16,1,.3,1);width:0}
.src-num{width:28px;font-size:16px;font-weight:800;text-align:right}
.ann-chip{font-size:10px;background:var(--gold-g);color:var(--gold);padding:2px 6px;border-radius:999px;margin-left:6px;font-weight:700}
.stagger>*{animation:fadeUp .5s cubic-bezier(.16,1,.3,1) backwards}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.10s}.stagger>*:nth-child(4){animation-delay:.14s}.stagger>*:nth-child(5){animation-delay:.18s}

@media(max-width:760px){
  .topbar{position:relative;align-items:flex-start;gap:10px;padding:12px 14px;flex-wrap:wrap}
  .brand{width:calc(100% - 48px)}.right{position:absolute;right:14px;top:10px}.updated{display:none}
  .nav{order:3;width:100%;overflow-x:auto;padding-bottom:3px}.nav button{flex:0 0 auto;padding:8px 13px}
  main{padding:20px 14px 60px}.g5,.g4{grid-template-columns:1fr 1fr}.staff-grid{grid-template-columns:repeat(2,1fr)}
  .card{padding:17px}.kpi-v{font-size:27px}.ph h2{font-size:26px}
}
@media(max-width:460px){.g5,.g4{grid-template-columns:1fr}.staff-grid{grid-template-columns:1fr 1fr}}
.staff-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.data-alert{display:none;margin-bottom:18px;padding:12px 16px;border-radius:14px;background:color-mix(in oklch,var(--pink) 12%,transparent);color:var(--pink);font-weight:700;font-size:13px}
.empty{padding:32px;text-align:center;color:var(--mu)}
</style>
</head>

salesRep":"Cindy","receptionist":"Cindy","anniversary":false},{"date":"2026-09-21","time":"14:30","name":"聿言設計","source":"設計公司","company":"聿言設計","people":7,"purpose":"了解品牌","note":"了解品牌","salesRep":"Cindy","receptionist":"Cindy","anniversary":false},{"date":"2026-09-22","time":"16:00","name":"莫赫榭設計","source":"設計公司","company":"","people":3,"purpose":"配案採購需求","note":"Penny 設計師到店討論","salesRep":"Cindy","receptionist":"Kelvin","anniversary":false},{"date":"2026-09-30","time":"12:00","name":"慕慕陳設","source":"設計公司","company":"慕慕陳設","people":1,"purpose":"其他","note":"其他","salesRep":"Cindy","receptionist":"Cindy","anniversary":false}]</script>
<script>
(function(){
  'use strict';
  const DATA=JSON.parse(document.getElementById('visitor-data').textContent);
  const MONTH_NAME={"01":"一月","02":"二月","03":"三月","04":"四月","05":"五月","06":"六月","07":"七月","08":"八月","09":"九月","10":"十月","11":"十一月","12":"十二月"};
  const MONTH_SHORT={"01":"Jan","02":"Feb","03":"Mar","04":"Apr","05":"May","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Oct","11":"Nov","12":"Dec"};
  const STAFF=["Cindy","Sean","Kelvin","Daniel","Aaron"];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const monthOf=r=>r.date.slice(5,7);
  const months=[...new Set(DATA.map(monthOf))].sort();
  const latest=months[months.length-1], previous=months[months.length-2];
  const year=DATA.length?DATA[0].date.slice(0,4):'2026';
  const latestName=MONTH_NAME[latest], previousName=MONTH_NAME[previous];
  const monthData=m=>DATA.filter(r=>monthOf(r)===m);
  const isPurchase=r=>r.purpose.includes('配案')||r.purpose.includes('採購');
  const stat=rows=>{
    const src={owner:{count:0,people:0},design:{count:0,people:0},other:{count:0,people:0}};
    const purposes={learn:0,purchase:0,other:0};
    rows.forEach(r=>{
      const key=r.source==='業主'?'owner':r.source==='設計公司'?'design':'other';
      src[key].count++;src[key].people+=Number(r.people)||0;
      if(isPurchase(r))purposes.purchase++;else if(r.purpose.includes('了解品牌'))purposes.learn++;else purposes.other++;
    });
    return {count:rows.length,people:rows.reduce((s,r)=>s+(Number(r.people)||0),0),src,purposes,conversion:rows.length?Math.round(purposes.purchase/rows.length*100):0};
  };
  const stats=Object.fromEntries(months.map(m=>[m,stat(monthData(m))]));
  const latestStat=stats[latest], prevStat=stats[previous], totalStat=stat(DATA);
  const classify=pct=>pct>40?{label:'高意願 🔥',cls:'pill-gold'}:pct>=20?{label:'一般',cls:''}:{label:'品牌認知型',cls:''};
  const diff=(a,b,suffix='')=>{
    const d=a-b, cls=d>0?'up':d<0?'dn':'eq', arrow=d>0?'↑':d<0?'↓':'—';
    return `<span class="diff ${cls}">${arrow} ${d===0?'持平':(d>0?'+':'')+d+suffix}</span>`;
  };
  const monthRange=`${MONTH_NAME[months[0]]}—${MONTH_NAME[latest]}`;

  document.getElementById('updatedLabel').textContent=`最後更新：${year} 年${latestName}`;
  document.title=`BAKER 台中門市 ${latestName}月報儀表板`;

  function renderOverview(){
    const s=latestStat,p=prevStat,cl=classify(s.conversion);
    const monthlyVisits=months.map(m=>`${MONTH_SHORT[m]}${stats[m].count}`).join('・');
    const monthlyPeople=months.map(m=>`${MONTH_SHORT[m]}${stats[m].people}`).join('・');
    const staff=STAFF.map(name=>({name,count:monthData(latest).filter(r=>r.receptionist.includes(name)).length})).sort((a,b)=>b.count-a.count||STAFF.indexOf(a.name)-STAFF.indexOf(b.name));
    document.getElementById('page-overview').innerHTML=`
      <div class="ph"><span class="pill">最新月報</span><h2>${latestName}月報總覽</h2><p>BAKER 台中門市・${year} 年${latestName}完整數據・${monthRange}累計匯總</p></div>
      <div class="sec">${latestName}當月 KPI</div>
      <div class="g5 stagger" style="margin-bottom:26px">
        <div class="card kpi" style="--kc:var(--blue)"><div class="kpi-l">訪客次數</div><div class="kpi-v">${s.count}</div><div class="kpi-s">筆記錄</div></div>
        <div class="card kpi" style="--kc:var(--teal)"><div class="kpi-l">總人數</div><div class="kpi-v">${s.people}</div><div class="kpi-s">人到訪</div></div>
        <div class="card kpi" style="--kc:var(--green)"><div class="kpi-l">業主來訪</div><div class="kpi-v">${s.src.owner.count}</div><div class="kpi-s">次・${s.src.owner.people} 人</div></div>
        <div class="card kpi" style="--kc:var(--pink)"><div class="kpi-l">設計公司</div><div class="kpi-v">${s.src.design.count}</div><div class="kpi-s">次・${s.src.design.people} 人</div></div>
        <div class="card kpi" style="--kc:var(--gold)"><div class="kpi-l">配案占比</div><div class="kpi-v" style="font-size:28px">${s.conversion}%</div><div class="kpi-s">${cl.label}</div></div>
      </div>
      <div class="sec">${monthRange}累計</div>
      <div class="g4 stagger" style="margin-bottom:26px">
        <div class="card"><div class="kpi-l">總訪次（筆）</div><div class="kpi-v" style="color:var(--blue)">${totalStat.count}</div><div class="kpi-s">${monthlyVisits}</div></div>
        <div class="card"><div class="kpi-l">總人數（人）</div><div class="kpi-v" style="color:var(--teal)">${totalStat.people}</div><div class="kpi-s">${monthlyPeople}</div></div>
        <div class="card"><div class="kpi-l">業主來訪（次）</div><div class="kpi-v" style="color:var(--green)">${totalStat.src.owner.count}</div><div class="kpi-s">${months.map(m=>`${MONTH_SHORT[m]}${stats[m].src.owner.count}`).join('・')}</div></div>
        <div class="card"><div class="kpi-l">配案採購（筆）</div><div class="kpi-v" style="color:var(--pink)">${totalStat.purposes.purchase}</div><div class="kpi-s">整體配案占比 ${totalStat.conversion}%</div></div>
      </div>
      <div class="sec">${previousName} VS ${latestName}</div>
      <div class="card" style="margin-bottom:26px"><div class="tbl-scroll"><table><thead><tr><th>指標</th><th>${previousName}</th><th>${latestName}</th><th>變化</th></tr></thead><tbody>
        <tr><td>訪客次數（筆）</td><td>${p.count}</td><td>${s.count}</td><td>${diff(s.count,p.count)}</td></tr>
        <tr><td>總人數（人）</td><td>${p.people}</td><td>${s.people}</td><td>${diff(s.people,p.people)}</td></tr>
        <tr><td>業主（次）</td><td>${p.src.owner.count}</td><td>${s.src.owner.count}</td><td>${diff(s.src.owner.count,p.src.owner.count)}</td></tr>
        <tr><td>業主人數（人）</td><td>${p.src.owner.people}</td><td>${s.src.owner.people}</td><td>${diff(s.src.owner.people,p.src.owner.people)}</td></tr>
        <tr><td>設計公司（次）</td><td>${p.src.design.count}</td><td>${s.src.design.count}</td><td>${diff(s.src.design.count,p.src.design.count)}</td></tr>
        <tr><td>配案採購（筆）</td><td>${p.purposes.purchase}</td><td>${s.purposes.purchase}</td><td>${diff(s.purposes.purchase,p.purposes.purchase)}</td></tr>
        <tr><td>配案占比</td><td>${p.conversion}%</td><td>${s.conversion}%</td><td>${diff(s.conversion,p.conversion,'%')}</td></tr>
      </tbody></table></div></div>
      <div class="sec">${latestName}接待人員</div>
      <div class="staff-grid stagger">${staff.map((x,i)=>`<div class="card staff-card"><div class="sc-name">${esc(x.name)}</div><div class="sc-num" style="color:${['var(--blue)','var(--green)','var(--pink)','var(--gold)','var(--mu)'][i]}">${x.count}</div><div class="sc-l">次接待</div></div>`).join('')}</div>`;
  }

  function sourceBadge(source){return source==='業主'?'b-owner':source==='設計公司'?'b-design':'b-other'}
  function purposeBadge(r){return isPurchase(r)?'b-purchase':r.purpose.includes('了解品牌')?'b-learn':'b-other'}
  function monthBlock(m){
    const s=stats[m],cl=classify(s.conversion),latestMark=m===latest?' 🆕 最新月報':'',ann=m==='06'?' 🎂':'';
    const rows=monthData(m).map(r=>`<tr>
      <td>${esc(r.date.slice(5).replace('-','/'))}<br><span style="color:var(--faint);font-size:12px">${esc(r.time||'—')}</span></td>
      <td>${esc(r.name)}${r.anniversary?' <span class="ann-chip">周年慶</span>':''}</td>
      <td><span class="badge ${sourceBadge(r.source)}">${esc(r.source)}</span></td><td>${esc(r.company||'—')}</td><td>${r.people}</td>
      <td><span class="badge ${purposeBadge(r)}">${esc(isPurchase(r)?'配案採購':r.purpose)}</span></td>
      <td>${esc(r.note||'—').replace(/\n/g,'<br>')}</td><td>${esc(r.receptionist)}</td></tr>`).join('');
    return `<div class="card month-block" data-m="${m}" style="margin-bottom:20px"><div class="mb-hd"><div><h3>${MONTH_NAME[m]}${ann}${latestMark}</h3><p>${s.count} 筆・${s.people} 人・業主 ${s.src.owner.count} 次・設計 ${s.src.design.count} 次・其他 ${s.src.other.count} 次・配案 ${s.conversion}%</p></div><span class="pill ${cl.cls}">${cl.label}</span></div><div class="tbl-scroll"><table><thead><tr><th>日期</th><th>姓名</th><th>來源</th><th>設計公司</th><th>人數</th><th>目的</th><th>備註</th><th>接待</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  function renderDetail(){
    const filters=months.map(m=>`<button class="f-btn${m===latest?' active':''}" data-m="${m}">${MONTH_NAME[m]}（${stats[m].count}筆）${m==='06'?'🎂':m===latest?'🆕':''}</button>`).join('');
    document.getElementById('page-detail').innerHTML=`<div class="ph"><span class="pill">完整記錄</span><h2>訪客明細</h2><p>${year} 年${monthRange}・共 ${totalStat.count} 筆完整到訪記錄</p></div><div class="filter-row" id="mf"><button class="f-btn" data-m="all">全部（${totalStat.count}筆）</button>${filters}</div><div id="monthBlocks">${months.map(monthBlock).join('')}</div>`;
    document.querySelectorAll('#mf .f-btn').forEach(b=>b.addEventListener('click',()=>{
      document.querySelectorAll('#mf .f-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
      document.querySelectorAll('.month-block').forEach(mb=>mb.style.display=(b.dataset.m==='all'||mb.dataset.m===b.dataset.m)?'':'none');
    }));
    document.querySelectorAll('.month-block').forEach(mb=>mb.style.display=mb.dataset.m===latest?'':'none');
  }

  let sourceViews={},charts=[];
  function aggregateMonths(list){return stat(DATA.filter(r=>list.includes(monthOf(r))))}
  function buildSourceViews(){
    months.forEach(m=>sourceViews[m]={...stats[m],label:MONTH_NAME[m],icon:m===latest?'🆕':m==='06'?'🎂':'📅',badge:MONTH_NAME[m]});
    const qs=[...new Set(months.map(m=>Math.floor((Number(m)-1)/3)+1))];
    qs.forEach(q=>{const list=months.filter(m=>Math.floor((Number(m)-1)/3)+1===q),s=aggregateMonths(list),key=`q${q}`;sourceViews[key]={...s,label:`Q${q} 累計（${MONTH_NAME[list[0]].replace('月','')}—${MONTH_NAME[list[list.length-1]]}）`,icon:'📦',badge:`Q${q} 累計`}});
    sourceViews.ytd={...totalStat,label:'全年累積（YTD）',icon:'📊',badge:'YTD'};
  }
  function renderTrend(){
    buildSourceViews();
    const monthItems=months.map(m=>`<div class="drop-item${m===latest?' active':''}" data-key="${m}"><span>${sourceViews[m].icon}</span><span>${MONTH_NAME[m]}${m==='06'?'・周年慶':''}</span><span class="di-badge">${stats[m].count}筆</span></div>`).join('');
    const quarterKeys=Object.keys(sourceViews).filter(k=>/^q\d$/.test(k));
    const quarterItems=quarterKeys.map(k=>`<div class="drop-item" data-key="${k}"><span>📦</span><span>${sourceViews[k].label}</span><span class="di-badge">${sourceViews[k].count}筆</span></div>`).join('');
    document.getElementById('page-trend').innerHTML=`
      <div class="ph"><span class="pill">${monthRange}</span><h2>趨勢分析</h2><p>人次組成・配案占比・來源分布（可切換月份／季度／總累積）</p></div>
      <div class="sec">來源分布<span id="src-badge" style="margin-left:8px;font-size:12px;color:var(--mu)">${latestName}</span></div>
      <div class="src-card-outer" style="margin-bottom:24px"><div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap"><div><h3 style="margin:0 0 2px">來源分布</h3><p style="margin:0;font-size:13px;color:var(--mu)">業主／設計公司／其他 次數比例</p></div><div class="drop-wrap" id="srcDropWrap"><button class="drop-btn" id="srcDropBtn"><span id="db-icon">🆕</span><span id="db-label">${latestName}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto"><path d="M6 9l6 6 6-6"/></svg></button><div class="drop-menu" id="srcDropMenu"><div class="drop-g-label">月份</div>${monthItems}<div class="drop-g-label">季度</div>${quarterItems}<div class="drop-g-label">總累積</div><div class="drop-item" data-key="ytd"><span>📊</span><span>全年累積（YTD）</span><span class="di-badge">${totalStat.count}筆</span></div></div></div></div><div class="src-layout"><div style="width:130px;height:130px"><canvas id="srcDonut"></canvas></div><div><div class="src-row"><span class="src-label">業主</span><div class="src-track"><div class="src-fill" id="sf-o" style="background:var(--blue)"></div></div><span class="src-num" id="sn-o" style="color:var(--blue)"></span></div><div class="src-row"><span class="src-label">設計公司</span><div class="src-track"><div class="src-fill" id="sf-d" style="background:var(--green)"></div></div><span class="src-num" id="sn-d" style="color:var(--green)"></span></div><div class="src-row"><span class="src-label">其他</span><div class="src-track"><div class="src-fill" id="sf-x" style="background:var(--mu)"></div></div><span class="src-num" id="sn-x" style="color:var(--mu)"></span></div></div></div></div></div>
      <div class="g2" style="margin-bottom:24px"><div class="card"><h3 style="margin:0 0 4px">每月人次組成</h3><p style="margin:0 0 14px;font-size:13px;color:var(--mu)">業主＋設計公司＋其他（人）</p><div class="chart-wrap"><canvas id="stackChart"></canvas></div></div><div class="card"><h3 style="margin:0 0 4px">到訪次數比較</h3><p style="margin:0 0 14px;font-size:13px;color:var(--mu)">業主／設計公司／其他（次）</p><div class="chart-wrap"><canvas id="typeChart"></canvas></div></div></div>
      <div class="sec">配案採購轉換率</div><div class="card"><h3 style="margin:0 0 4px">配案占比歷史</h3><p style="margin:0 0 16px;font-size:13px;color:var(--mu)">配案採購筆數 ÷ 當月訪次　＞40% 為高意願</p><div id="conv-list"></div></div>`;
    document.getElementById('srcDropBtn').addEventListener('click',()=>document.getElementById('srcDropMenu').classList.toggle('open'));
    document.addEventListener('click',e=>{const w=document.getElementById('srcDropWrap');if(w&&!w.contains(e.target))document.getElementById('srcDropMenu').classList.remove('open')});
    document.querySelectorAll('.drop-item').forEach(item=>item.addEventListener('click',()=>selectSource(item)));
    document.getElementById('conv-list').innerHTML=months.map(m=>{const s=stats[m],c=classify(s.conversion),color=s.conversion>40?'var(--gold)':'var(--mu)',bg=s.conversion>40?'var(--gold-g)':'color-mix(in oklch,var(--mu) 15%,transparent)';return `<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px"><span style="width:44px;font-size:14px;font-weight:700;color:${color}">${MONTH_NAME[m]}</span><div style="flex:1;background:color-mix(in oklch,var(--text) 8%,transparent);border-radius:999px;height:10px;overflow:hidden"><div style="height:100%;border-radius:999px;background:${color};width:${s.conversion}%;transition:width 1.2s cubic-bezier(.16,1,.3,1)"></div></div><span style="width:44px;font-weight:800;color:${color};text-align:right">${s.conversion}%</span><span style="font-size:12px;padding:4px 10px;border-radius:999px;background:${bg};color:${color};font-weight:700">${c.label}</span></div>`}).join('');
    updateSource(sourceViews[latest]);renderCharts();
  }
  function selectSource(item){
    const d=sourceViews[item.dataset.key];document.getElementById('db-icon').textContent=d.icon;document.getElementById('db-label').textContent=d.label;document.getElementById('src-badge').textContent=d.badge;document.querySelectorAll('.drop-item').forEach(x=>x.classList.remove('active'));item.classList.add('active');updateSource(d);document.getElementById('srcDropMenu').classList.remove('open');
  }
  function updateSource(d){
    const vals=[d.src.owner.count,d.src.design.count,d.src.other.count],total=vals.reduce((a,b)=>a+b,0);
    ['o','d','x'].forEach((k,i)=>{document.getElementById('sn-'+k).textContent=vals[i];document.getElementById('sf-'+k).style.width=(total?vals[i]/total*100:0)+'%'});
    const donut=charts.find(c=>c.canvas&&c.canvas.id==='srcDonut');if(donut){donut.data.datasets[0].data=vals;donut.update()}
  }
  function renderCharts(){
    charts.forEach(c=>c.destroy());charts=[];
    if(typeof Chart==='undefined'){const a=document.getElementById('dataAlert');a.style.display='block';a.textContent='圖表元件載入失敗，請確認目前網路連線後重新整理。';return}
    const css=getComputedStyle(document.documentElement),blue=css.getPropertyValue('--blue').trim(),green=css.getPropertyValue('--green').trim(),mu=css.getPropertyValue('--mu').trim(),grid='rgba(150,150,150,.15)',font={size:12,family:'Noto Sans TC'};
    const current=sourceViews[document.querySelector('.drop-item.active')?.dataset.key||latest]||sourceViews[latest];
    charts.push(new Chart(document.getElementById('srcDonut'),{type:'doughnut',data:{labels:['業主','設計公司','其他'],datasets:[{data:[current.src.owner.count,current.src.design.count,current.src.other.count],backgroundColor:[blue,green,mu],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false}}}}));
    const totals=months.map(m=>stats[m].people);
    charts.push(new Chart(document.getElementById('stackChart'),{type:'bar',data:{labels:months.map(m=>MONTH_NAME[m]),datasets:[{label:'業主',data:months.map(m=>stats[m].src.owner.people),backgroundColor:blue+'99',stack:'s',borderSkipped:false},{label:'設計公司',data:months.map(m=>stats[m].src.design.people),backgroundColor:green+'99',stack:'s',borderSkipped:false},{label:'其他',data:months.map(m=>stats[m].src.other.people),backgroundColor:mu+'55',stack:'s',borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:mu,usePointStyle:true,pointStyle:'circle',boxWidth:8,padding:12,font}},tooltip:{callbacks:{footer:items=>'總人次：'+items.reduce((s,i)=>s+i.parsed.y,0)+' 人'}}},scales:{x:{ticks:{color:mu,font},grid:{color:grid}},y:{ticks:{color:mu,font},grid:{color:grid},suggestedMax:Math.max(...totals)+5}}},plugins:[{id:'totalLabel',afterDatasetsDraw(chart){const ctx=chart.ctx;months.forEach((m,i)=>{let bar=null;for(let d=chart.data.datasets.length-1;d>=0;d--){if(chart.data.datasets[d].data[i]>0){bar=chart.getDatasetMeta(d).data[i];break}}if(!bar)return;ctx.save();ctx.font='bold 13px Noto Sans TC';ctx.fillStyle=mu;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(totals[i]+' 人',bar.x,bar.y-8);ctx.restore()})}}]}));
    charts.push(new Chart(document.getElementById('typeChart'),{type:'bar',data:{labels:months.map(m=>MONTH_NAME[m]),datasets:[{label:'業主（次）',data:months.map(m=>stats[m].src.owner.count),backgroundColor:blue+'cc',borderRadius:6,borderSkipped:false},{label:'設計公司（次）',data:months.map(m=>stats[m].src.design.count),backgroundColor:green+'cc',borderRadius:6,borderSkipped:false},{label:'其他（次）',data:months.map(m=>stats[m].src.other.count),backgroundColor:mu+'55',borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:mu,usePointStyle:true,pointStyle:'circle',boxWidth:8,padding:12,font}}},scales:{x:{ticks:{color:mu,font},grid:{color:grid}},y:{ticks:{color:mu,font,precision:0},grid:{color:grid},beginAtZero:true}}}}));
  }

  function renderAnalysis(){
    const s=latestStat,p=prevStat,top=STAFF.map(name=>({name,count:monthData(latest).filter(r=>r.receptionist.includes(name)).length})).sort((a,b)=>b.count-a.count)[0];
    const visitChange=s.count-p.count,peopleChange=s.people-p.people,convChange=s.conversion-p.conversion;
    const designTitle=s.src.design.count>0&&p.src.design.count===0?'設計公司來訪恢復':'設計公司來訪變化';
    const designText=s.src.design.count>0?`${latestName}共有 ${s.src.design.count} 筆設計公司到訪、合計 ${s.src.design.people} 人；${previousName}為 ${p.src.design.count} 筆，設計端互動明顯回升。`:`${latestName}設計公司到訪為 0 筆，仍需持續觀察設計端互動。`;
    const purposeRows=[['了解品牌','learn','b-learn'],['配案採購','purchase','b-purchase'],['其他','other','b-other']].map(([label,key,cls])=>{const total=months.reduce((a,m)=>a+stats[m].purposes[key],0);return `<tr><td><span class="badge ${cls}">${label}</span></td>${months.map(m=>`<td>${stats[m].purposes[key]}</td>`).join('')}<td>${total}</td><td style="color:var(--mu);font-weight:700">${Math.round(total/totalStat.count*100)}%</td></tr>`}).join('');
    document.getElementById('page-analysis').innerHTML=`
      <div class="ph"><span class="pill pill-gold">${latestName}觀察</span><h2>分析報告</h2><p>${latestName}客觀趨勢觀察・${monthRange}累計回顧</p></div>
      <div class="sec">${latestName}市場觀察</div><div class="a-grid stagger">
        <div class="card a-card" style="--ac:var(--blue)"><div class="a-tag">📈 到訪成長</div><div class="a-title">訪次與人數較${previousName}增加</div><div class="a-text">${latestName}訪客 ${s.count} 筆、總人數 ${s.people} 人，較${previousName}增加 ${visitChange} 筆與 ${peopleChange} 人，單月到訪規模回升。</div></div>
        <div class="card a-card" style="--ac:var(--gold)"><div class="a-tag">📊 配案占比</div><div class="a-title">配案占比升至 ${s.conversion}%</div><div class="a-text">${latestName}有 ${s.purposes.purchase} 筆配案採購，占比 ${s.conversion}%，較${previousName}的 ${p.conversion}% ${convChange>=0?'增加':'減少'} ${Math.abs(convChange)} 個百分點。</div></div>
        <div class="card a-card" style="--ac:var(--green)"><div class="a-tag">🏢 設計端互動</div><div class="a-title">${designTitle}</div><div class="a-text">${designText}</div></div>
        <div class="card a-card" style="--ac:var(--teal)"><div class="a-tag">👥 接待集中度</div><div class="a-title">${top.name} 承接主要接待量</div><div class="a-text">${latestName}由 ${top.name} 接待 ${top.count} 筆；其餘為 ${STAFF.filter(n=>n!==top.name).map(n=>`${n} ${monthData(latest).filter(r=>r.receptionist.includes(n)).length} 筆`).join('、')}。</div></div>
      </div>
      <div class="sec">參訪目的分布（${monthRange}）</div><div class="card"><div class="tbl-scroll"><table><thead><tr><th>目的</th>${months.map(m=>`<th>${MONTH_NAME[m]}</th>`).join('')}<th>合計</th><th>占比</th></tr></thead><tbody>${purposeRows}</tbody></table></div></div>`;
  }

  function initTheme(){
    const d=document.documentElement,btn=document.getElementById('themeBtn'),icon=document.getElementById('themeIcon'),dm=matchMedia('(prefers-color-scheme:dark)').matches;
    const moon='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',sun='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
    d.setAttribute('data-theme',dm?'dark':'light');icon.innerHTML=dm?sun:moon;
    btn.addEventListener('click',()=>{const n=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',n);icon.innerHTML=n==='dark'?sun:moon;if(document.getElementById('srcDonut'))renderCharts()});
  }
  function initNav(){document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+b.dataset.page).classList.add('active')}))}

  if(!DATA.length){const a=document.getElementById('dataAlert');a.style.display='block';a.textContent='找不到訪客資料，請檢查 Excel 是否包含日期、姓名、來源、人數、參訪目的與接待人員欄位。';return}
  initTheme();renderOverview();renderDetail();renderTrend();renderAnalysis();initNav();
})();
</script>
</body>
</html>
