
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAKER 台中門市 八月月報儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#eef1f6; --bg2:#e3e8f0;
  --glass:rgba(255,255,255,.55); --glass-brd:rgba(255,255,255,.65);
  --card:rgba(255,255,255,.5); --card-brd:rgba(140,150,180,.22);
  --text:#1b1f2b; --mu:#5b6172; --faint:#9aa0b2;
  --blue:#2f6fed; --teal:#0ea5a0; --green:#2e9e5b; --pink:#e0507a; --gold:#d59a1f; --gold-g:rgba(213,154,31,.15);
  --shadow:0 8px 32px rgba(31,41,71,.10);
}
[data-theme="dark"]{
  --bg:#0d1017; --bg2:#141824;
  --glass:rgba(30,34,46,.55); --glass-brd:rgba(255,255,255,.10);
  --card:rgba(35,39,52,.48); --card-brd:rgba(255,255,255,.08);
  --text:#e8eaf0; --mu:#9aa0b5; --faint:#5c6172;
  --blue:#5b93ff; --teal:#3fd0c9; --green:#5cd485; --pink:#ff7fa3; --gold:#f0c04a; --gold-g:rgba(240,192,74,.15);
  --shadow:0 8px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,*,*::before,*::after{transition:background-color .4s cubic-bezier(.4,0,.2,1),color .4s cubic-bezier(.4,0,.2,1),border-color .4s cubic-bezier(.4,0,.2,1),box-shadow .4s cubic-bezier(.4,0,.2,1)}
body{margin:0;font-family:'Noto Sans TC',sans-serif;color:var(--text);
  background:
    radial-gradient(ellipse 70% 50% at 15% 0%, color-mix(in oklch,var(--blue) 12%,transparent) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 20%, color-mix(in oklch,var(--teal) 10%,transparent) 0%, transparent 60%),
    linear-gradient(160deg,var(--bg),var(--bg2));
  min-height:100vh;
}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  background:var(--glass);border-bottom:1px solid var(--glass-brd);}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.brand svg{width:26px;height:26px;color:var(--blue)}
.nav{display:flex;gap:8px}
.nav button{padding:9px 18px;border-radius:999px;border:1px solid transparent;background:transparent;
  color:var(--mu);font-weight:700;font-size:14px;cursor:pointer;transition:all .3s cubic-bezier(.16,1,.3,1)}
.nav button:hover{background:color-mix(in oklch,var(--blue) 10%,transparent);color:var(--text)}
.nav button.active{background:var(--blue);color:#fff;box-shadow:0 4px 16px color-mix(in oklch,var(--blue) 40%,transparent)}
.right{display:flex;align-items:center;gap:12px}
.updated{font-size:12px;color:var(--faint)}
#themeBtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--card-brd);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px)}
#themeBtn svg{width:18px;height:18px;color:var(--text)}
#themeBtn:active{transform:scale(.9)}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
.page{display:none;animation:fadeUp .5s cubic-bezier(.16,1,.3,1)}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph h2{font-size:clamp(24px,3vw,32px);margin:4px 0 4px;font-weight:900}
.ph p{color:var(--mu);margin:0 0 20px;font-size:14px}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;
  background:color-mix(in oklch,var(--blue) 16%,transparent);color:var(--blue)}
.pill-gold{background:var(--gold-g);color:var(--gold)}
.sec{font-weight:800;font-size:15px;margin:28px 0 12px;color:var(--text)}
.card{background:var(--card);border:1px solid var(--card-brd);border-radius:20px;padding:22px;
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);box-shadow:var(--shadow);
  transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s ease;position:relative;z-index:1;}
.card:hover{transform:translateY(-3px)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in oklch,var(--kc) 10%,transparent),transparent 60%)}
.kpi-l{font-size:13px;color:var(--mu);font-weight:600;position:relative}
.kpi-v{font-size:30px;font-weight:900;color:var(--kc);margin:6px 0 2px;position:relative;font-variant-numeric:tabular-nums}
.kpi-s{font-size:12px;color:var(--faint);position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mu);font-weight:700;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--card-brd)}
td{padding:11px 12px;border-bottom:1px solid var(--card-brd);vertical-align:top}
tbody tr{transition:background .2s}
tbody tr:hover{background:color-mix(in oklch,var(--blue) 5%,transparent)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-owner{background:color-mix(in oklch,var(--blue) 16%,transparent);color:var(--blue)}
.b-design{background:color-mix(in oklch,var(--green) 16%,transparent);color:var(--green)}
.b-other{background:color-mix(in oklch,var(--mu) 16%,transparent);color:var(--mu)}
.b-learn{background:color-mix(in oklch,var(--teal) 16%,transparent);color:var(--teal)}
.b-purchase{background:color-mix(in oklch,var(--pink) 16%,transparent);color:var(--pink)}
.diff{font-weight:800;font-size:13px}
.up{color:var(--green)}.dn{color:var(--pink)}.eq{color:var(--mu)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.f-btn{padding:8px 16px;border-radius:999px;border:1px solid var(--card-brd);background:var(--card);
  color:var(--mu);font-weight:700;font-size:13px;cursor:pointer;backdrop-filter:blur(10px);transition:all .3s cubic-bezier(.16,1,.3,1)}
.f-btn:hover{transform:translateY(-2px)}
.f-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.month-block{margin-bottom:22px}
.mb-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mb-hd h3{margin:0;font-size:17px;font-weight:800}
.mb-hd p{margin:2px 0 0;font-size:13px;color:var(--mu)}
.tbl-scroll{overflow-x:auto}
.staff-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.staff-card{background:var(--card);border:1px solid var(--card-brd);border-radius:16px;padding:16px;text-align:center;backdrop-filter:blur(14px)}
.sc-name{font-weight:700;font-size:14px;color:var(--mu)}
.sc-num{font-size:26px;font-weight:900;margin:6px 0 2px}
.sc-l{font-size:12px;color:var(--faint)}
.a-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.a-grid{grid-template-columns:1fr}}
.a-card{position:relative}
.a-card::before{content:'';position:absolute;top:0;left:22px;right:22px;height:3px;border-radius:0 0 4px 4px;background:var(--ac)}
.a-tag{font-size:12px;font-weight:800;color:var(--ac);margin-bottom:6px}
.a-title{font-weight:800;font-size:16px;margin-bottom:8px}
.a-text{font-size:13.5px;color:var(--mu);line-height:1.7}
.chart-wrap{position:relative;height:280px}
.drop-wrap{position:relative}
.drop-btn{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;
  background:rgba(20,24,32,.9);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(1.6);
  cursor:pointer;font-weight:700;font-size:14px;min-width:190px;box-shadow:var(--shadow);
  color:#fff !important;}
.drop-btn svg{color:#fff !important;stroke:#fff !important}
#db-icon,#db-label{color:#fff !important}
.drop-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:230px;border-radius:16px;
  background:rgba(18,22,30,.92);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(28px) saturate(1.8);
  box-shadow:0 20px 50px rgba(0,0,0,.45);padding:8px;display:none;z-index:9999;}
.drop-menu.open{display:block;animation:fadeUp .25s cubic-bezier(.16,1,.3,1)}
.drop-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;
  color:#fff !important;font-size:13.5px;font-weight:600}
.drop-item:hover,.drop-item.active{background:rgba(255,255,255,.10)}
.drop-g-label{font-size:11px;color:rgba(255,255,255,.5);padding:8px 12px 4px;font-weight:700}
.di-badge{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);color:#fff !important;padding:2px 8px;border-radius:999px}
.src-card-outer{position:relative;z-index:200;isolation:isolate;}
.src-layout{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:28px}
@media(max-width:640px){.src-layout{grid-template-columns:1fr}}
.src-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.src-label{width:64px;font-size:14px;color:var(--mu);font-weight:600;flex-shrink:0}
.src-track{flex:1;background:color-mix(in oklch,var(--text) 8%,transparent);border-radius:7px;height:14px;overflow:hidden;min-width:60px}
.src-fill{height:100%;border-radius:7px;transition:width 1.2s cubic-bezier(.16,1,.3,1);width:0}
.src-num{width:28px;font-size:16px;font-weight:800;text-align:right}
.ann-chip{font-size:10px;background:var(--gold-g);color:var(--gold);padding:2px 6px;border-radius:999px;margin-left:6px;font-weight:700}
.stagger>*{animation:fadeUp .5s cubic-bezier(.16,1,.3,1) backwards}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.10s}.stagger>*:nth-child(4){animation-delay:.14s}.stagger>*:nth-child(5){animation-delay:.18s}
</style>
</head>
